[project]
name = "fpledge"
version = "0.1.0"
description = "FPL-first prediction system: one Dixon-Coles engine feeding expected points (FPL) and an honest CLV/calibration benchmark (betting)."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pandas>=2.1",
  "numpy>=1.26",
  "duckdb>=0.10",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "pulp>=2.8",
  "penaltyblog>=1.0",
  # soccerdata was here for ingest/understat.py alone. Dropped 2026-08-05: its Understat
  # reader scrapes a `shotsData` blob the site no longer embeds, and the replacement talks to
  # Understat's JSON endpoints with `requests` and one header. A heavy, fragile dependency
  # (it pulls a native TLS library at runtime) removed for less code, not more.
  "mlflow>=2.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
# API layer (Phase 0 full-stack pivot): only needed to serve/precompute, not for the
# stdlib-only core or model fitting. httpx backs FastAPI's TestClient.
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

# Match briefings (fpledge.brief). Optional on purpose: with neither this package nor an
# ANTHROPIC_API_KEY, every briefing is rendered from the deterministic template instead, and
# the precompute runs exactly as before. Narration is never allowed to be load-bearing.
llm = ["anthropic>=0.69"]

# S3 landing zone (fpledge.ingest.landing). Optional on purpose: with FPLEDGE_RAW_URI unset the
# captures write to local disk exactly as before and boto3 is never imported. Needed only where
# the captures run against durable storage — i.e. on a scheduler, which is the whole point of
# moving them off one laptop.
aws = ["boto3>=1.34"]

# NOTE: the core numeric modules (scoring, betting.odds, eval.metrics,
# models.match_engine, features.pointintime) are deliberately STDLIB-ONLY so their
# tests run with nothing but pytest installed. Heavy deps above are only needed
# for ingestion, the DuckDB feature store, model fitting, and MLflow.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fpledge*"]

[tool.ruff]
line-length = 100
target-version = "py311"

# WHY THIS BLOCK EXISTS. The project inherits ruff's default rule selection, which had drifted:
# the symptom was 97 stale `# noqa` comments for rules that no longer fired, i.e. suppressions
# for a ruleset nobody had chosen. Those are gone. What remains below is the set of rules this
# codebase deliberately declines, each with its reason — silent `# noqa` sprinkling is how the
# first mess happened, so an exclusion lives here where it can be argued with, or not at all.
#
# The ruleset can still move under a ruff upgrade. CI pins the ruff version for that reason;
# bumping it is a deliberate commit, not a surprise on an unrelated branch.
[tool.ruff.lint]
ignore = [
    # Multi-line f-strings inside a list literal. Deliberate and idiomatic in `balance.py`'s
    # report renderer — the adjacent strings are meant to join.
    "ISC004",
    # `strptime` without a timezone. Every use parses a DATE and immediately calls `.date()`;
    # a timezone would be noise on a value that has no time component.
    "DTZ007",
    # `dict(a=1, b=2)` over `{"a": 1}`. The keyword form reads better for the wide test fixtures
    # in `test_xpoints.py`, which is the only place it is used.
    "C408",
    # `try/except: continue`. Used once, on a malformed odds row, with a comment saying so —
    # skipping one bad row is the intended behaviour, not a swallowed error.
    "S112",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI resolves Depends()/Query() in argument defaults — that's the idiom, not a B008 bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
