name: debug-oidc
on: workflow_dispatch
permissions:
  id-token: write
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print the token claims AWS actually sees
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          echo "$PAYLOAD$(printf '=%.0s' $(seq 1 $PAD))" | base64 -d | python3 -c "import json,sys; c=json.load(sys.stdin); print(json.dumps({k:c.get(k) for k in ('iss','aud','sub','repository','ref')}, indent=2))"
